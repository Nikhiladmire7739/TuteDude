<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LaundryMart</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <main class="login-container">

        <!-- Left illustration section -->
        <section class="illustration-section">
            <div class="illustration-content">
                <div class="brand">Laundry<span>Mart</span></div>
                <h1>Welcome back!</h1>
                <p>
                    Fresh clothes, simple service, and everything you need
                    in one place. Sign in to continue your laundry journey.
                </p>
            </div>

            <img
                src="https://images.unsplash.com/photo-1517677208171-0bc6725a3e60?auto=format&fit=crop&w=1200&q=85"
                alt="Laundry and washing machine illustration"
            >
        </section>

        <!-- Login form section -->
        <section class="form-section">
            <form class="login-form">
                <div class="form-header">
                    <div class="mobile-logo">Laundry<span>Mart</span></div>
                    <h2>Welcome Back 👋</h2>
                    <p>Enter your details to access your account.</p>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="login-button">Login</button>

                <p class="signup-text">
                    Don't have an account?
                    <a href="#">Create an account</a>
                </p>
            </form>
        </section>

    </main>

</body>
</html>
